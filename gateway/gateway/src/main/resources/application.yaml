server:
  port: ${PORT:8083}

# Shared with the auth service: both must use the same value (at least 32 characters)
jwt:
  secret: ${JWT_SECRET}

services:
  activity-url: ${ACTIVITY_SERVICE_URL:http://localhost:8088}

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  cloud:
    gateway:
      default-filters:
        # Some services also send CORS headers: keep only the gateway's
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/auth/**

        - id: student-service
          uri: ${STUDENT_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/students/**,/universities/**

        - id: course-service
          uri: ${COURSE_SERVICE_URL:http://localhost:8002}
          predicates:
            - Path=/courses/**,/student-courses/**

        - id: graphql-gateway
          uri: ${GRAPHQL_SERVICE_URL:http://localhost:8003}
          predicates:
            - Path=/graphql/**

        - id: chatbot-service
          uri: ${CHATBOT_SERVICE_URL:http://localhost:8004}
          predicates:
            - Path=/chatbot/**

        - id: activity-service
          uri: ${ACTIVITY_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/activity/**

      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
            allowedHeaders: "*"
            allowedMethods: "*"
            allowCredentials: true
