# LearnU: run the whole platform with
#   docker compose up --build
# then open http://localhost:5173
#
# Only the frontend (5173) and the API gateway (8083) are published:
# every other service is reachable only inside the Docker network,
# so all traffic has to go through the gateway and its JWT check.

x-django-env: &django-env
  DEBUG: "False"
  PYTHONUNBUFFERED: "1"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth_service
    environment:
      <<: *django-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-learnu}:${POSTGRES_PASSWORD}@postgres:5432/auth_db
    depends_on:
      postgres:
        condition: service_healthy

  course-service:
    build: ./course-service
    environment:
      <<: *django-env
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: course-service,localhost
      DATABASE_URL: postgres://${POSTGRES_USER:-learnu}:${POSTGRES_PASSWORD}@postgres:5432/course_db
      DATABASE_SSL: "False"
    depends_on:
      postgres:
        condition: service_healthy

  student-service:
    build: ./studentservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/student_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-learnu}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

  activity-service:
    build: ./activityservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/activity_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-learnu}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: "8088"
    depends_on:
      postgres:
        condition: service_healthy

  graphql-gateway:
    build: ./graphql_gateway
    environment:
      <<: *django-env
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      COURSE_SERVICE_URL: http://course-service:8000
      STUDENT_SERVICE_URL: http://student-service:8080

  # Heavy (PyTorch + ~2 GB of models downloaded on first use):
  # only started with `docker compose --profile ai up --build`
  chatbot-service:
    build: ./chatbot
    profiles: ["ai"]
    environment:
      <<: *django-env
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: chatbot-service,localhost
    volumes:
      - hf-cache:/root/.cache/huggingface

  api-gateway:
    build: ./gateway/gateway
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:5173}
      AUTH_SERVICE_URL: http://auth-service:8000
      COURSE_SERVICE_URL: http://course-service:8000
      STUDENT_SERVICE_URL: http://student-service:8080
      ACTIVITY_SERVICE_URL: http://activity-service:8088
      GRAPHQL_SERVICE_URL: http://graphql-gateway:8000
      CHATBOT_SERVICE_URL: http://chatbot-service:8000
    depends_on:
      - auth-service
      - course-service
      - student-service
      - activity-service
      - graphql-gateway

  frontend:
    build:
      context: ./learnu2
      args:
        VITE_API_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:8083}
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  pgdata:
  hf-cache:
